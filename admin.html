<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grihani Admin Panel</title>
    
    <script>
        window.onload = function() {
            let pass = prompt("कृपया एडमिन पासवर्ड दर्ज करें / Please enter Admin Password:");
            if (pass !== "admin123") { alert("गलत पासवर्ड! / Wrong Password!"); window.location.href = "index.html"; } 
            else { 
                document.getElementById('langToggleBtnAdmin').innerText = currentLangAdmin === 'hi' ? '🌐 English' : '🌐 हिंदी';
                applyAdminLanguage();
                loadCategoriesAdmin(); loadProductsAdmin(); loadOrdersAdmin(); loadReelsAdmin(); loadCustomersListAdmin(); 
            }
        };
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
        import { getDatabase, ref, set, push, onValue, remove, update, get } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBhR9J0h01e81bSpUs2rTqV9JRndL38eUQ",
            authDomain: "grihanicosmeticapp.firebaseapp.com",
            databaseURL: "https://grihanicosmeticapp-default-rtdb.firebaseio.com",
            projectId: "grihanicosmeticapp",
            storageBucket: "grihanicosmeticapp.firebasestorage.app",
            messagingSenderId: "921623248962",
            appId: "1:921623248962:web:413b6e003eca864b7caddb"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // 🌐 Admin Language System
        window.currentLangAdmin = localStorage.getItem('grihani_admin_lang') || 'hi';
        const adminDict = {
            "dash_title": { hi: "🛠️ Grihani Admin Dashboard", en: "🛠️ Grihani Admin Dashboard" },
            "new_orders": { hi: "📥 नए ऑर्डर्स (New Orders)", en: "📥 New Orders" },
            "dispatch_orders": { hi: "🚚 रास्ते में हैं (Dispatched)", en: "🚚 Dispatched Orders" },
            "reg_customers": { hi: "👥 रजिस्टर्ड कस्टमर्स", en: "👥 Registered Customers" },
            "categories": { hi: "📁 कैटेगरीज", en: "📁 Categories" },
            "add_product": { hi: "🛍️ प्रोडक्ट जोड़ें", en: "🛍️ Add Product" },
            "add_reel": { hi: "🎥 रील जोड़ें", en: "🎥 Add Reel" },
            "btn_add": { hi: "➕ जोड़ें", en: "➕ Add" },
            "btn_publish": { hi: "➕ पब्लिश करें", en: "➕ Publish" },
            "btn_publish_reel": { hi: "🎬 पब्लिश करें", en: "🎬 Publish Reel" }
        };

        window.toggleLanguageAdmin = function() {
            window.currentLangAdmin = window.currentLangAdmin === 'hi' ? 'en' : 'hi';
            localStorage.setItem('grihani_admin_lang', window.currentLangAdmin);
            document.getElementById('langToggleBtnAdmin').innerText = window.currentLangAdmin === 'hi' ? '🌐 English' : '🌐 हिंदी';
            applyAdminLanguage();
            loadOrdersAdmin(); // Reload dynamic content language
        }

        window.applyAdminLanguage = function() {
            document.querySelectorAll('[data-lang-key]').forEach(el => {
                let key = el.getAttribute('data-lang-key');
                if(adminDict[key]) el.innerText = adminDict[key][window.currentLangAdmin];
            });
        }

        window.loadCategoriesAdmin = function() {
            onValue(ref(db, 'categories'), (snapshot) => {
                const data = snapshot.val(); let selectBox = document.getElementById('pCategory'); let adminCatList = document.getElementById('adminCatList'); selectBox.innerHTML = ''; adminCatList.innerHTML = '';
                let categories = data ? data : { "Bridal": "ब्राइडल", "Gifts": "गिफ्ट्स", "Daily": "डेली वियर" };
                Object.keys(categories).forEach((catKey) => { selectBox.innerHTML += `<option value="${catKey}">${categories[catKey]}</option>`; adminCatList.innerHTML += `<div class="admin-item"><span>📁 ${categories[catKey]} (${catKey})</span><button class="delete-btn" onclick="deleteCategory('${catKey}')">❌</button></div>`; });
            });
        }
        window.addNewCategory = function() { let catKey = document.getElementById('catKeyInput').value.trim(), catName = document.getElementById('catNameInput').value.trim(); if(!catKey || !catName) return alert("भरें! / Fill fields!"); set(ref(db, 'categories/' + catKey), catName).then(() => { alert("कैटेगरी जुड़ गई! / Category Added!"); document.getElementById('catKeyInput').value = ''; document.getElementById('catNameInput').value = ''; }); }
        window.deleteCategory = function(catKey) { if(confirm("हटाना है? / Delete?")) remove(ref(db, 'categories/' + catKey)); }

        window.loadProductsAdmin = function() {
            onValue(ref(db, 'products'), (snapshot) => {
                const data = snapshot.val(); let adminListDiv = document.getElementById('adminProductList'); adminListDiv.innerHTML = '';
                if (!data) return adminListDiv.innerHTML = '<p style="color: #bdc3c7;">अभी कोई प्रोडक्ट नहीं है।</p>';
                Object.keys(data).forEach((key) => { adminListDiv.innerHTML += `<div class="admin-item"><span>${data[key].name} <small>(₹${data[key].price})</small></span><button class="delete-btn" onclick="deleteProduct('${key}')">❌</button></div>`; });
            });
        }
        window.addNewProductToFirebase = function() { let name = document.getElementById('pName').value, category = document.getElementById('pCategory').value, price = document.getElementById('pPrice').value, fileInput = document.getElementById('pImage'); if(!name || !price || fileInput.files.length === 0) return alert("भरें! / Fill all fields!"); let reader = new FileReader(); reader.onload = function(e) { set(push(ref(db, 'products')), { name, category, price, image: e.target.result }).then(() => { alert("प्रोडक्ट जुड़ गया! / Product Added!"); document.getElementById('pName').value = ''; document.getElementById('pPrice').value = ''; }); }; reader.readAsDataURL(fileInput.files[0]); }
        window.deleteProduct = function(key) { if(confirm("हटाना है? / Delete?")) remove(ref(db, 'products/' + key)); }

        window.addNewReelToFirebase = function() { let title = document.getElementById('rTitle').value, videoUrl = document.getElementById('rVideoUrl').value, instaUrl = document.getElementById('rInstaUrl').value; if(!title || !videoUrl) return alert("भरें! / Fill fields!"); set(push(ref(db, 'reels')), { title, url: videoUrl, instaUrl: instaUrl || '#' }).then(() => { alert("रील पब्लिश! / Reel Published!"); document.getElementById('rTitle').value = ''; document.getElementById('rVideoUrl').value = ''; }); }
        window.deleteReel = function(key) { if(confirm("हटाना है? / Delete?")) remove(ref(db, 'reels/' + key)); }
        window.loadReelsAdmin = function() { onValue(ref(db, 'reels'), (snapshot) => { const data = snapshot.val(); let adminReelList = document.getElementById('adminReelList'); adminReelList.innerHTML = ''; if(!data) return adminReelList.innerHTML = '<p style="color: #bdc3c7; font-size:13px;">कोई रील नहीं है। / No reels.</p>'; Object.keys(data).forEach(key => { adminReelList.innerHTML += `<div class="admin-item"><span>🎥 ${data[key].title}</span><button class="delete-btn" onclick="deleteReel('${key}')">❌</button></div>`; }); }); }

        window.loadCustomersListAdmin = function() { onValue(ref(db, 'customers'), (snapshot) => { const data = snapshot.val(); let custDiv = document.getElementById('adminCustomerList'); custDiv.innerHTML = ''; if(!data) return; Object.keys(data).forEach((key) => { let c = data[key]; custDiv.innerHTML += `<div class="order-card" style="border-left-color: #800020;"><p>👤 ${c.name} | 📞 ${c.phone}</p><p>📍 ${c.address}</p><p style="font-size:11px; color:#7f8c8d;">📅 ${c.date}</p></div>`; }); }); }
        
        window.loadOrdersAdmin = function() {
            onValue(ref(db, 'orders'), (snapshot) => {
                const data = snapshot.val();
                let newOrdersDiv = document.getElementById('adminNewOrders'), dispatchedDiv = document.getElementById('adminDispatchedOrders');
                newOrdersDiv.innerHTML = ''; dispatchedDiv.innerHTML = '';
                if (!data) return;
                
                Object.keys(data).forEach((key) => {
                    let order = data[key], itemsList = '';
                    if(order.items) order.items.forEach(item => itemsList += `${item.name}(x${item.qty}), `);
                    
                    let trackingInfo = order.courierLink ? `<p style="font-size:11px; color:#2980b9; margin-top:4px;">🔗 Link Added</p>` : '';
                    let billInfo = order.billNumber ? `<p style="font-size:11px; color:#27ae60; margin-top:2px;">🧾 Bill: ${order.billNumber}</p>` : '';
                    let onlineStatus = order.paymentMode === "Online Paid" ? `<span style="background:#27ae60; color:white; padding:2px 5px; border-radius:3px;">✅ Online Paid</span>` : order.paymentMode;

                    let cardHtml = `<div class="order-card"><p>👤 ${order.customerName} (${order.customerPhone})</p><p>📍 ${order.customerAddress}</p><p style="color:#800020; font-size:12px; margin:6px 0;">🛍️ ${itemsList}</p><p>💳 ${onlineStatus} | 💰 ${order.total}</p><p style="font-size:11px; color:#7f8c8d;">📅 ${order.date}</p>${trackingInfo}${billInfo}`;
                    
                    let btnLoc = window.currentLangAdmin === 'hi' ? '📍 लोकेशन अपडेट करें' : '📍 Update Location';
                    let btnDel = window.currentLangAdmin === 'hi' ? '✨ डिलीवर (समाप्त करें)' : '✨ Mark Delivered';
                    let btnCan = window.currentLangAdmin === 'hi' ? '❌ रद्द करें' : '❌ Cancel Order';
                    let btnDisp = window.currentLangAdmin === 'hi' ? '🚚 डिस्पैच करें' : '🚚 Dispatch';

                    if (order.status === 'Dispatched') {
                        dispatchedDiv.innerHTML += cardHtml + `
                            <button class="track-btn" onclick="addTrackingUpdate('${key}')">${btnLoc}</button>
                            <button class="complete-order-btn" onclick="markDelivered('${key}')">${btnDel}</button>
                            <button class="cancel-order-btn" onclick="markCancelled('${key}')">${btnCan}</button>
                        </div>`;
                    } else {
                        newOrdersDiv.innerHTML += cardHtml + `
                            <button class="dispatch-btn" onclick="markDispatched('${key}')">${btnDisp}</button>
                            <button class="cancel-order-btn" onclick="markCancelled('${key}')">${btnCan}</button>
                        </div>`;
                    }
                });
            });
        }

        window.markDispatched = function(key) { 
            let courierLink = prompt("कूरियर का ट्रैकिंग लिंक यहाँ पेस्ट करें / Paste Courier Link (Leave empty if none):");
            let billNumber = prompt("Tohands का बिल नंबर डालें / Enter Tohands Bill Number:");
            
            let updateData = { status: 'Dispatched' };
            if(courierLink && courierLink.trim() !== '') updateData.courierLink = courierLink.trim();
            if(billNumber && billNumber.trim() !== '') updateData.billNumber = billNumber.trim();

            update(ref(db, 'orders/' + key), updateData).then(() => {
                push(ref(db, `orders/${key}/tracking`), { msg: window.currentLangAdmin === 'hi' ? "सामान डिस्पैच (पैक होकर निकल) चुका है।" : "Order Dispatched.", time: new Date().toLocaleString() });
            }); 
        }
        
        window.addTrackingUpdate = function(key) {
            let msg = prompt("लोकेशन या स्टेटस लिखें / Enter tracking update:");
            if(msg) {
                push(ref(db, `orders/${key}/tracking`), { msg: msg, time: new Date().toLocaleString() }).then(() => {
                    alert("📍 ट्रैकिंग अपडेट हो गई! / Tracking Updated!");
                });
            }
        }
        
        window.markDelivered = function(key) { 
            if(confirm("क्या यह ऑर्डर सफलतापूर्वक डिलीवर हो गया है? / Successfully Delivered?")) {
                let deliveryTime = new Date().toLocaleString(); 
                get(ref(db, 'orders/' + key)).then((snapshot) => {
                    if(snapshot.exists()) {
                        let orderData = snapshot.val(); orderData.status = 'Delivered'; orderData.deliveredAt = deliveryTime;
                        if(!orderData.tracking) orderData.tracking = {};
                        let newKey = push(ref(db, 'dummy')).key;
                        orderData.tracking[newKey] = { msg: "सफलतापूर्वक डिलीवर हो गया! / Delivered Successfully!", time: deliveryTime };
                        
                        set(ref(db, 'order_history/' + key), orderData).then(() => { remove(ref(db, 'orders/' + key)); alert("✅ डिलीवर हो गया! / Delivered!"); });
                    }
                });
            } 
        }

        window.markCancelled = function(key) { 
            if(confirm("क्या आप इसे रद्द करना चाहते हैं? / Cancel this order?")) {
                let cancelTime = new Date().toLocaleString(); 
                get(ref(db, 'orders/' + key)).then((snapshot) => {
                    if(snapshot.exists()) {
                        let orderData = snapshot.val(); orderData.status = 'Cancelled'; orderData.deliveredAt = "Cancelled on " + cancelTime;
                        set(ref(db, 'order_history/' + key), orderData).then(() => { remove(ref(db, 'orders/' + key)); alert("❌ रद्द हो गया! / Cancelled!"); });
                    }
                });
            } 
        }
    </script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #1e272e; color: white; display: flex; flex-direction:column; align-items: center; padding: 20px; }
        .header-bar { width: 100%; max-width: 800px; display:flex; justify-content: flex-end; margin-bottom: 10px; }
        .lang-btn { background: #f1c40f; color: #1e272e; border: none; padding: 6px 12px; border-radius: 15px; cursor: pointer; font-size: 13px; font-weight: bold; }
        .admin-panel { width: 100%; max-width: 800px; padding: 25px; background-color: #2c3e50; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .admin-panel h2 { text-align: center; color: #f1c40f; margin-bottom: 20px; }
        .grid-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; } @media(max-width: 768px) { .grid-layout { grid-template-columns: 1fr; } }
        .manage-section { background-color: #34495e; padding: 15px; border-radius: 8px; margin-bottom: 15px; } .manage-section h3 { margin-bottom: 10px; border-bottom: 1px solid #7f8c8d; padding-bottom: 5px; color: #fff; font-size: 16px; }
        .form-group { margin-bottom: 10px; } .form-group input, .form-group select { width: 100%; padding: 8px; border: none; border-radius: 4px; font-size: 13px; } .form-group input[type="file"] { background-color: #fff; color: #333; }
        .add-btn { background-color: #27ae60; color: white; border: none; padding: 10px; font-size: 14px; font-weight: bold; border-radius: 5px; cursor: pointer; width: 100%; }
        .admin-item { display: flex; justify-content: space-between; align-items: center; background: #ecf0f1; color: #333; padding: 8px; margin-bottom: 6px; border-radius: 4px; font-size: 13px; font-weight: bold; } .delete-btn { background-color: #e74c3c; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
        .order-card { background-color: #ecf0f1; color: #2c3e50; padding: 12px; border-radius: 6px; margin-bottom: 10px; border-left: 5px solid #e67e22; box-shadow: 0 2px 5px rgba(0,0,0,0.2); } .order-card p { margin-bottom: 4px; font-size: 13px; font-weight: bold; }
        .dispatch-btn { background-color: #e67e22; color: white; border: none; padding: 8px; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 8px; width: 100%; }
        .track-btn { background-color: #3498db; color: white; border: none; padding: 8px; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 8px; width: 100%; }
        .complete-order-btn { background-color: #27ae60; color: white; border: none; padding: 8px; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 8px; width: 100%; }
        .cancel-order-btn { background-color: #e74c3c; color: white; border: none; padding: 6px; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 6px; width: 100%; font-size:12px; }
    </style>
</head>
<body>
    <div class="header-bar">
        <button id="langToggleBtnAdmin" class="lang-btn" onclick="toggleLanguageAdmin()">🌐 English</button>
    </div>
    <div class="admin-panel">
        <h2 data-lang-key="dash_title">🛠️ Grihani Admin Dashboard</h2>
        <div class="grid-layout">
            <div class="column">
                <div class="manage-section" style="border-left: 4px solid #3498db;"><h3 data-lang-key="new_orders">📥 नए ऑर्डर्स (New Orders)</h3><div id="adminNewOrders"></div></div>
                <div class="manage-section" style="border-left: 4px solid #27ae60;"><h3 data-lang-key="dispatch_orders">🚚 रास्ते में हैं (Dispatched)</h3><div id="adminDispatchedOrders"></div></div>
                <div class="manage-section" style="border-left: 4px solid #9b59b6;"><h3 data-lang-key="reg_customers">👥 रजिस्टर्ड कस्टमर्स</h3><div id="adminCustomerList"></div></div>
            </div>
            <div class="column">
                <div class="manage-section" style="border-left: 4px solid #f1c40f;"><h3 data-lang-key="categories">📁 कैटेगरीज</h3><div class="form-group"><input type="text" id="catKeyInput" placeholder="Code"></div><div class="form-group"><input type="text" id="catNameInput" placeholder="Name"></div><button class="add-btn" onclick="addNewCategory()" data-lang-key="btn_add">➕ जोड़ें</button><div id="adminCatList" style="margin-top: 10px;"></div></div>
                <div class="manage-section" style="border-left: 4px solid #e67e22;"><h3 data-lang-key="add_product">🛍️ प्रोडक्ट जोड़ें</h3><div class="form-group"><input type="text" id="pName" placeholder="Name"></div><div class="form-group"><select id="pCategory"></select></div><div class="form-group"><input type="number" id="pPrice" placeholder="Price (₹)"></div><div class="form-group"><input type="file" id="pImage" accept="image/*"></div><button class="add-btn" onclick="addNewProductToFirebase()" data-lang-key="btn_publish">➕ पब्लिश करें</button><div id="adminProductList" style="margin-top: 10px; max-height: 150px; overflow-y: auto;"></div></div>
                <div class="manage-section" style="border-left: 4px solid #e74c3c;"><h3 data-lang-key="add_reel">🎥 रील जोड़ें</h3><div class="form-group"><input type="text" id="rTitle" placeholder="Title"></div><div class="form-group"><input type="text" id="rVideoUrl" placeholder="MP4 Link"></div><div class="form-group"><input type="text" id="rInstaUrl" placeholder="Insta Link (Optional)"></div><button class="add-btn" onclick="addNewReelToFirebase()" data-lang-key="btn_publish_reel">🎬 पब्लिश करें</button><div id="adminReelList" style="margin-top: 10px;"></div></div>
            </div>
        </div>
    </div>
</body>
</html>
