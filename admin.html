<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>गृहणी एडमिन डैशबोर्ड - लॉग इन</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #0e1626; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-container { background: #1a2639; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); width: 100%; max-width: 400px; }
        .login-container h2 { text-align: center; margin-bottom: 20px; color: #f39c12; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #34495e; background: #0e1626; color: #fff; border-radius: 4px; box-sizing: border-box; }
        .login-btn { width: 100%; padding: 10px; background: #f39c12; border: none; color: #fff; font-size: 16px; border-radius: 4px; cursor: pointer; }
        .login-btn:hover { background: #e67e22; }
        .error-msg { color: #e74c3c; text-align: center; margin-top: 10px; font-size: 14px; }
        #admin-dashboard { display: none; }
    </style>
</head>
<body>

    <!-- लॉग इन फॉर्म -->
    <div class="login-container" id="login-section">
        <h2>गृहणी एडमिन लॉग इन</h2>
        <div class="form-group">
            <label for="email">ईमेल आईडी</label>
            <input type="email" id="email" placeholder="admin@example.com">
        </div>
        <div class="form-group">
            <label for="password">पासवर्ड</label>
            <input type="password" id="password" placeholder="********">
        </div>
        <button class="login-btn" onclick="loginAdmin()">लॉग इन करें</button>
        <div class="error-msg" id="error-message"></div>
    </div>

    <!-- मुख्य एडमिन डैशबोर्ड (लॉग इन के बाद दिखेगा) -->
    <div id="admin-dashboard" style="width: 100%; height: 100vh; padding: 20px; box-sizing: border-box;">
        <h1>गृहणी एडमिन डैशबोर्ड में आपका स्वागत है</h1>
        <button onclick="logoutAdmin()" style="padding: 8px 15px; background: #e74c3c; border: none; color: #fff; border-radius: 4px; cursor: pointer; margin-top: 20px;">लॉग आउट</button>
    </div>

    <script>
        // Firebase कॉन्फ़िगरेशन (अपनी डिटेल्स यहाँ भरें)
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            databaseURL: "YOUR_DATABASE_URL",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // Firebase इनिशियलाइज करें
        firebase.initializeApp(firebaseConfig);

        // लॉग इन फंक्शन
        function loginAdmin() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorMsg = document.getElementById('error-message');

            if (!email || !password) {
                errorMsg.innerText = "कृपया ईमेल और पासवर्ड दोनों भरें।";
                return;
            }

            firebase.auth().signInWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    // लॉग इन सफल
                    document.getElementById('login-section').style.display = 'none';
                    document.getElementById('admin-dashboard').style.display = 'block';
                })
                .catch((error) => {
                    // ऑथेंटिकेशन एरर
                    errorMsg.innerText = "ऑथेंटिकेशन एरर: " + error.message;
                });
        }

        // लॉग आउट फंक्शन
        function logoutAdmin() {
            firebase.auth().signOut().then(() => {
                document.getElementById('login-section').style.display = 'block';
                document.getElementById('admin-dashboard').style.display = 'none';
                document.getElementById('email').value = '';
                document.getElementById('password').value = '';
                document.getElementById('error-message').innerText = '';
            });
        }
    </script>
</body>
</html>
