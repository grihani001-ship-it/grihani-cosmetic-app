<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grihani Admin Panel</title>
    
    <script>
        window.onload = function() {
            let pass = prompt("Please enter Admin Password / कृपया एडमिन पासवर्ड दर्ज करें:");
            if (pass !== "admin123") { alert("Wrong Password! / गलत पासवर्ड!"); window.location.href = "index.html"; } 
            else { 
                document.getElementById('langToggleBtnAdmin').innerText = currentLangAdmin === 'en' ? '🌐 हिंदी' : '🌐 English';
                applyAdminLanguage();
                loadCategoriesAdmin(); loadProductsAdmin(); loadOrdersAdmin(); loadReelsAdmin(); loadCustomersListAdmin(); loadBannersAdmin();
            }
        };
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
        import { getDatabase, ref, set, push, onValue, remove, update, get } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js";
        // --- Firebase Storage Import किया गया है ---
        import { getStorage, ref as storageRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBhR9J0h01e81bSpUs2rTqV9JRndL38eUQ",
            authDomain: "grihanicosmeticapp.firebaseapp.com",
            databaseURL: "https://grihanicosmeticapp-default-rtdb.firebaseio.com",
            projectId: "grihanicosmeticapp",
            storageBucket: "grihanicosmeticapp.firebasestorage.app",
            messagingSenderId: "921623248962",
            appId: "1:921623248962:web:413b6e003eca864b7caddb"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const storage = getStorage(app); // Storage Initialize किया गया

        window.currentLangAdmin = localStorage.getItem('grihani_admin_lang') || 'en';
        const adminDict = {
            "dash_title": { hi: "🛠️ Grihani Admin Dashboard", en: "🛠️ Grihani Admin Dashboard" },
            "new_orders": { hi: "📥 नए ऑर्डर्स (New Orders)", en: "📥 New Orders" },
            "dispatch_orders": { hi: "🚚 रास्ते में हैं (Dispatched)", en: "🚚 Dispatched Orders" },
            "reg_customers": { hi: "👥 रजिस्टर्ड कस्टमर्स", en: "👥 Registered Customers" },
            "categories": { hi: "📁 कैटेगरीज", en: "📁 Manage Categories" },
            "add_product": { hi: "🛍️ प्रोडक्ट जोड़ें", en: "🛍️ Add Product" },
            "add_reel": { hi: "🎥 रील जोड़ें", en: "🎥 Add Reel" },
            "manage_banners": { hi: "🖼️ मास्टर बैनर", en: "🖼️ Master Banners" },
            "btn_add": { hi: "➕ जोड़ें", en: "➕ Add" },
            "btn_publish": { hi: "➕ पब्लिश करें", en: "➕ Publish" },
            "btn_publish_reel": { hi: "🎬 पब्लिश करें", en: "🎬 Publish Reel" },
            "btn_publish_banner": { hi: "🖼️ अपलोड बैनर", en: "🖼️ Upload Banner" }
        };

        window.toggleLanguageAdmin = function() {
            window.currentLangAdmin = window.currentLangAdmin === 'en' ? 'hi' : 'en';
            localStorage.setItem('grihani_admin_lang', window.currentLangAdmin);
            document.getElementById('langToggleBtnAdmin').innerText = window.currentLangAdmin === 'en' ? '🌐 हिंदी' : '🌐 English';
            applyAdminLanguage(); loadOrdersAdmin(); 
        }

        window.applyAdminLanguage = function() {
            document.querySelectorAll('[data-lang-key]').forEach(el => {
                let key = el.getAttribute('data-lang-key');
                if(adminDict[key]) el.innerText = adminDict[key][window.currentLangAdmin];
            });
        }

        window.loadBannersAdmin = function() {
            onValue(ref(db, 'banners'), (snapshot) => {
                const data = snapshot.val(); let adminListDiv = document.getElementById('adminBannerList'); adminListDiv.innerHTML = '';
                if (!data) return adminListDiv.innerHTML = '<p style="color: #bdc3c7; font-size:12px;">No banners found.</p>';
                Object.keys(data).forEach((key) => { 
                    adminListDiv.innerHTML += `<div class="admin-item"><img src="${data[key].image}" style="width:50px; height:25px; object-fit:cover; border-radius:3px;"><span>Banner</span><button class="delete-btn" onclick="deleteBanner('${key}')">❌</button></div>`; 
                });
            });
        }

        // --- Banner Upload को Firebase Storage से जोड़ा गया है ---
        window.addNewBannerToFirebase = async function() { 
            let fileInput = document.getElementById('bImage'); 
            if(fileInput.files.length === 0) return alert("Please select an image!"); 
            
            try {
                let btn = document.querySelector('[onclick="addNewBannerToFirebase()"]');
                let oldText = btn.innerText;
                btn.innerText = "⏳ Uploading...";
                btn.disabled = true;

                let file = fileInput.files[0];
                let uniqueName = new Date().getTime() + '-' + file.name;
                let sRef = storageRef(storage, 'banners/' + uniqueName);
                
                await uploadBytes(sRef, file);
                let downloadURL = await getDownloadURL(sRef);

                await set(push(ref(db, 'banners')), { image: downloadURL });
                alert("Banner Added!"); 
                fileInput.value = ''; 
                
                btn.innerText = oldText;
                btn.disabled = false;
            } catch(e) {
                console.error(e); alert("Error uploading banner!");
                let btn = document.querySelector('[onclick="addNewBannerToFirebase()"]');
                btn.innerText = "🖼️ Upload Banner"; btn.disabled = false;
            }
        }
        window.deleteBanner = function(key) { if(confirm("Delete Banner?")) remove(ref(db, 'banners/' + key)); }

        window.loadCategoriesAdmin = function() {
            onValue(ref(db, 'categories'), (snapshot) => {
                const data = snapshot.val(); let selectBox = document.getElementById('pCategory'); let adminCatList = document.getElementById('adminCatList'); selectBox.innerHTML = ''; adminCatList.innerHTML = '';
                let categories = data ? data : { "Bridal": "Bridal", "Gifts": "Gifts", "Daily": "Daily Wear" };
                Object.keys(categories).forEach((catKey) => { selectBox.innerHTML += `<option value="${catKey}">${categories[catKey]}</option>`; adminCatList.innerHTML += `<div class="admin-item"><span>📁 ${categories[catKey]} (${catKey})</span><button class="delete-btn" onclick="deleteCategory('${catKey}')">❌</button></div>`; });
            });
        }
        window.addNewCategory = function() { let catKey = document.getElementById('catKeyInput').value.trim(), catName = document.getElementById('catNameInput').value.trim(); if(!catKey || !catName) return alert("Fill fields!"); set(ref(db, 'categories/' + catKey), catName).then(() => { alert("Category Added!"); document.getElementById('catKeyInput').value = ''; document.getElementById('catNameInput').value = ''; }); }
        window.deleteCategory = function(catKey) { if(confirm("Delete?")) remove(ref(db, 'categories/' + catKey)); }

        window.loadProductsAdmin = function() {
            onValue(ref(db, 'products'), (snapshot) => {
                const data = snapshot.val(); let adminListDiv = document.getElementById('adminProductList'); adminListDiv.innerHTML = '';
                if (!data) return adminListDiv.innerHTML = '<p style="color: #bdc3c7;">No products available.</p>';
                Object.keys(data).forEach((key) => { adminListDiv.innerHTML += `<div class="admin-item"><span>${data[key].name} <small>(₹${data[key].price})</small></span><button class="delete-btn" onclick="deleteProduct('${key}')">❌</button></div>`; });
            });
        }
        
        // --- PRODUCT UPLOAD WITH MULTIPLE IMAGES & FIREBASE STORAGE ---
        window.addNewProductToFirebase = async function() { 
            let name = document.getElementById('pName').value, category = document.getElementById('pCategory').value, price = document.getElementById('pPrice').value, fileInput = document.getElementById('pImage'); 
            let desc = document.getElementById('pDesc').value.trim();
            let color = document.getElementById('pColor').value.trim();
            let size = document.getElementById('pSize').value.trim();

            if(!name || !price || fileInput.files.length === 0) return alert("Fill name, price and image! / नाम, कीमत और कम से कम एक फोटो ज़रूर डालें!"); 
            
            // Storage Helper Function
            const uploadImageAndGetURL = async (file) => {
                const uniqueName = new Date().getTime() + '-' + file.name;
                const fileRef = storageRef(storage, 'products/' + uniqueName);
                await uploadBytes(fileRef, file);
                return await getDownloadURL(fileRef); // सुरक्षित URL लाएगा
            };

            try {
                // बटन का टेक्स्ट बदलें ताकि पता चले कि अपलोड हो रहा है
                let btn = document.querySelector('[onclick="addNewProductToFirebase()"]');
                let originalText = btn.innerText;
                btn.innerText = "⏳ Uploading... Please wait";
                btn.disabled = true;

                // सभी फोटो को Firebase Storage में अपलोड करें
                let imagePromises = Array.from(fileInput.files).map(file => uploadImageAndGetURL(file));
                let imagesArray = await Promise.all(imagePromises); // यहाँ Cloud Storage के URLs आएंगे

                // Database में सिर्फ लिंक (URL) सेव करें
                await set(push(ref(db, 'products')), { 
                    name, category, price, desc, color, size, images: imagesArray 
                });
                
                alert("Product Added! / प्रोडक्ट जुड़ गया!"); 
                document.getElementById('pName').value = ''; document.getElementById('pPrice').value = ''; document.getElementById('pDesc').value = ''; document.getElementById('pColor').value = ''; document.getElementById('pSize').value = '';
                fileInput.value = ''; 
                
                btn.innerText = originalText;
                btn.disabled = false;
            } catch(error) {
                alert("फोटो अपलोड करने में समस्या आई।");
                console.error(error);
                let btn = document.querySelector('[onclick="addNewProductToFirebase()"]');
                btn.disabled = false;
                btn.innerText = "➕ Publish Product";
            }
        }
        // --------------------------------------------------------

        window.deleteProduct = function(key) { if(confirm("Delete?")) remove(ref(db, 'products/' + key)); }

        window.addNewReelToFirebase = function() { let title = document.getElementById('rTitle').value, videoUrl = document.getElementById('rVideoUrl').value, instaUrl = document.getElementById('rInstaUrl').value; if(!title || !videoUrl) return alert("Fill fields!"); set(push(ref(db, 'reels')), { title, url: videoUrl, instaUrl: instaUrl || '#' }).then(() => { alert("Reel Published!"); document.getElementById('rTitle').value = ''; document.getElementById('rVideoUrl').value = ''; }); }
        window.deleteReel = function(key) { if(confirm("Delete?")) remove(ref(db, 'reels/' + key)); }
        window.loadReelsAdmin = function() { onValue(ref(db, 'reels'), (snapshot) => { const data = snapshot.val(); let adminReelList = document.getElementById('adminReelList'); adminReelList.innerHTML = ''; if(!data) return adminReelList.innerHTML = '<p style="color: #bdc3c7; font-size:13px;">No reels.</p>'; Object.keys(data).forEach(key => { adminReelList.innerHTML += `<div class="admin-item"><span>🎥 ${data[key].title}</span><button class="delete-btn" onclick="deleteReel('${key}')">❌</button></div>`; }); }); }

        window.loadCustomersListAdmin = function() { onValue(ref(db, 'customers'), (snapshot) => { const data = snapshot.val(); let custDiv = document.getElementById('adminCustomerList'); custDiv.innerHTML = ''; if(!data) return; Object.keys(data).forEach((key) => { let c = data[key]; custDiv.innerHTML += `<div class="order-card" style="border-left-color: #800020;"><p>👤 ${c.name} | 📞 ${c.phone}</p><p>📍 ${c.address}</p><p style="font-size:11px; color:#7f8c8d;">📅 ${c.date}</p></div>`; }); }); }
        
        window.loadOrdersAdmin = function() {
            onValue(ref(db, 'orders'), (snapshot) => {
                const data = snapshot.val();
                let newOrdersDiv = document.getElementById('adminNewOrders'), dispatchedDiv = document.getElementById('adminDispatchedOrders');
                newOrdersDiv.innerHTML = ''; dispatchedDiv.innerHTML = '';
                if (!data) return;
                
                Object.keys(data).forEach((key) => {
                    let order = data[key], itemsList = '';
                    if(order.items) order.items.forEach(item => {
                        let variant = '';
                        if(item.selectedColor || item.selectedSize) variant = ` (${item.selectedColor || ''} ${item.selectedSize || ''})`;
                        itemsList += `${item.name}${variant}(x${item.qty}), `;
                    });
                    
                    let trackingInfo = order.courierLink ? `<p style="font-size:11px; color:#2980b9; margin-top:4px;">🔗 Link Added</p>` : '';
                    let billInfo = order.billNumber ? `<p style="font-size:11px; color:#27ae60; margin-top:2px;">🧾 Bill: ${order.billNumber}</p>` : '';
                    let onlineStatus = order.paymentMode === "Online Paid" ? `<span style="background:#27ae60; color:white; padding:2px 5px; border-radius:3px;">✅ Online Paid</span>` : order.paymentMode;

                    let cardHtml = `<div class="order-card"><p>👤 ${order.customerName} (${order.customerPhone})</p><p>📍 ${order.customerAddress}</p><p style="color:#800020; font-size:12px; margin:6px 0;">🛍️ ${itemsList}</p><p>💳 ${onlineStatus} | 💰 ${order.total}</p><p style="font-size:11px; color:#7f8c8d;">📅 ${order.date}</p>${trackingInfo}${billInfo}`;
                    
                    let btnLoc = window.currentLangAdmin === 'hi' ? '📍 लोकेशन अपडेट करें' : '📍 Update Location';
                    let btnDel = window.currentLangAdmin === 'hi' ? '✨ डिलीवर (समाप्त करें)' : '✨ Mark Delivered';
                    let btnCan = window.currentLangAdmin === 'hi' ? '❌ रद्द करें' : '❌ Cancel Order';
                    let btnDisp = window.currentLangAdmin === 'hi' ? '🚚 डिस्पैच करें' : '🚚 Dispatch';

                    if (order.status === 'Dispatched') {
                        dispatchedDiv.innerHTML += cardHtml + `<button class="track-btn" onclick="addTrackingUpdate('${key}')">${btnLoc}</button><button class="complete-order-btn" onclick="markDelivered('${key}')">${btnDel}</button><button class="cancel-order-btn" onclick="markCancelled('${key}')">${btnCan}</button></div>`;
                    } else {
                        newOrdersDiv.innerHTML += cardHtml + `<button class="dispatch-btn" onclick="markDispatched('${key}')">${btnDisp}</button><button class="cancel-order-btn" onclick="markCancelled('${key}')">${btnCan}</button></div>`;
                    }
                });
            });
        }

        window.markDispatched = function(key) { 
            let courierLink = prompt("Paste Courier Tracking Link (Leave empty if none):");
            let billNumber = prompt("Enter Tohands Bill Number:");
            let updateData = { status: 'Dispatched' };
            if(courierLink && courierLink.trim() !== '') updateData.courierLink = courierLink.trim();
            if(billNumber && billNumber.trim() !== '') updateData.billNumber = billNumber.trim();

            update(ref(db, 'orders/' + key), updateData).then(() => {
                push(ref(db, `orders/${key}/tracking`), { msg: window.currentLangAdmin === 'hi' ? "सामान डिस्पैच (पैक होकर निकल) चुका है।" : "Order Dispatched.", time: new Date().toLocaleString() });
            }); 
        }
        
        window.addTrackingUpdate = function(key) { let msg = prompt("Enter tracking location/status:"); if(msg) { push(ref(db, `orders/${key}/tracking`), { msg: msg, time: new Date().toLocaleString() }).then(() => { alert("📍 Tracking Updated!"); }); } }
        window.markDelivered = function(key) { if(confirm("Successfully Delivered?")) { let deliveryTime = new Date().toLocaleString(); get(ref(db, 'orders/' + key)).then((snapshot) => { if(snapshot.exists()) { let orderData = snapshot.val(); orderData.status = 'Delivered'; orderData.deliveredAt = deliveryTime; if(!orderData.tracking) orderData.tracking = {}; let newKey = push(ref(db, 'dummy')).key; orderData.tracking[newKey] = { msg: "Delivered Successfully!", time: deliveryTime }; set(ref(db, 'order_history/' + key), orderData).then(() => { remove(ref(db, 'orders/' + key)); alert("✅ Delivered!"); }); } }); } }
        window.markCancelled = function(key) { if(confirm("Cancel this order?")) { let cancelTime = new Date().toLocaleString(); get(ref(db, 'orders/' + key)).then((snapshot) => { if(snapshot.exists()) { let orderData = snapshot.val(); orderData.status = 'Cancelled'; orderData.deliveredAt = "Cancelled on " + cancelTime; set(ref(db, 'order_history/' + key), orderData).then(() => { remove(ref(db, 'orders/' + key)); alert("❌ Cancelled!"); }); } }); } }
    </script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #1e272e; color: white; display: flex; flex-direction:column; align-items: center; padding: 20px; }
        .header-bar { width: 100%; max-width: 800px; display:flex; justify-content: flex-end; margin-bottom: 10px; }
        .lang-btn { background: #f1c40f; color: #1e272e; border: none; padding: 6px 12px; border-radius: 15px; cursor: pointer; font-size: 13px; font-weight: bold; }
        .admin-panel { width: 100%; max-width: 800px; padding: 25px; background-color: #2c3e50; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .admin-panel h2 { text-align: center; color: #f1c40f; margin-bottom: 20px; }
        .grid-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; } 
        .manage-section { background-color: #34495e; padding: 15px; border-radius: 8px; margin-bottom: 15px; } .manage-section h3 { margin-bottom: 10px; border-bottom: 1px solid #7f8c8d; padding-bottom: 5px; color: #fff; font-size: 16px; }
        .form-group { margin-bottom: 10px; } .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 8px; border: none; border-radius: 4px; font-size: 13px; } .form-group input[type="file"] { background-color: #fff; color: #333; }
        .add-btn { background-color: #27ae60; color: white; border: none; padding: 10px; font-size: 14px; font-weight: bold; border-radius: 5px; cursor: pointer; width: 100%; }
        .add-btn:disabled { background-color: #7f8c8d; cursor: not-allowed; } /* Uploading के समय बटन ग्रे हो जाएगा */
        .admin-item { display: flex; justify-content: space-between; align-items: center; background: #ecf0f1; color: #333; padding: 8px; margin-bottom: 6px; border-radius: 4px; font-size: 13px; font-weight: bold; } .delete-btn { background-color: #e74c3c; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
        .order-card { background-color: #ecf0f1; color: #2c3e50; padding: 12px; border-radius: 6px; margin-bottom: 10px; border-left: 5px solid #e67e22; box-shadow: 0 2px 5px rgba(0,0,0,0.2); } .order-card p { margin-bottom: 4px; font-size: 13px; font-weight: bold; }
        .dispatch-btn { background-color: #e67e22; color: white; border: none; padding: 8px; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 8px; width: 100%; }
        .track-btn { background-color: #3498db; color: white; border: none; padding: 8px; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 8px; width: 100%; }
        .complete-order-btn { background-color: #27ae60; color: white; border: none; padding: 8px; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 8px; width: 100%; }
        .cancel-order-btn { background-color: #e74c3c; color: white; border: none; padding: 6px; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 6px; width: 100%; font-size:12px; }
        
        @media(max-width: 768px) { 
            body { padding: 10px; }
            .grid-layout { grid-template-columns: 1fr; } 
            .admin-panel { padding: 15px; }
            h2 { font-size: 20px; }
            .manage-section { padding: 12px; }
            .form-group input, .form-group select, .form-group textarea { font-size: 16px; padding: 10px; } 
            .add-btn, .dispatch-btn, .track-btn, .complete-order-btn, .cancel-order-btn { padding: 12px; font-size: 15px; } 
            .admin-item { flex-direction: column; align-items: flex-start; gap: 8px; }
            .delete-btn { align-self: flex-end; padding: 8px 12px; }
        }
    </style>
</head>
<body>
    <div class="header-bar">
        <button id="langToggleBtnAdmin" class="lang-btn" onclick="toggleLanguageAdmin()">🌐 हिंदी</button>
    </div>
    <div class="admin-panel">
        <h2 data-lang-key="dash_title">🛠️ Grihani Admin Dashboard</h2>
        <div class="grid-layout">
            <div class="column">
                <div class="manage-section" style="border-left: 4px solid #3498db;"><h3 data-lang-key="new_orders">📥 New Orders</h3><div id="adminNewOrders"></div></div>
                <div class="manage-section" style="border-left: 4px solid #27ae60;"><h3 data-lang-key="dispatch_orders">🚚 Dispatched Orders</h3><div id="adminDispatchedOrders"></div></div>
                <div class="manage-section" style="border-left: 4px solid #9b59b6;"><h3 data-lang-key="reg_customers">👥 Registered Customers</h3><div id="adminCustomerList"></div></div>
            </div>
            <div class="column">
                <div class="manage-section" style="border-left: 4px solid #1abc9c;"><h3 data-lang-key="manage_banners">🖼️ Master Banners</h3><div class="form-group"><input type="file" id="bImage" accept="image/*"></div><button class="add-btn" onclick="addNewBannerToFirebase()" data-lang-key="btn_publish_banner">🖼️ Upload Banner</button><div id="adminBannerList" style="margin-top: 10px; max-height: 120px; overflow-y: auto;"></div></div>
                <div class="manage-section" style="border-left: 4px solid #f1c40f;"><h3 data-lang-key="categories">📁 Manage Categories</h3><div class="form-group"><input type="text" id="catKeyInput" placeholder="Code (e.g. Bridal)"></div><div class="form-group"><input type="text" id="catNameInput" placeholder="Name to Display"></div><button class="add-btn" onclick="addNewCategory()" data-lang-key="btn_add">➕ Add</button><div id="adminCatList" style="margin-top: 10px;"></div></div>
                
                <div class="manage-section" style="border-left: 4px solid #e67e22;">
                    <h3 data-lang-key="add_product">🛍️ Add Product</h3>
                    <div class="form-group"><input type="text" id="pName" placeholder="Product Name / नाम *"></div>
                    <div class="form-group"><select id="pCategory"></select></div>
                    <div class="form-group"><input type="number" id="pPrice" placeholder="Price (₹) *"></div>
                    <div class="form-group"><textarea id="pDesc" placeholder="Description / प्रोडक्ट का विवरण" rows="2"></textarea></div>
                    <div class="form-group"><input type="text" id="pColor" placeholder="Colors (ex: Red, Blue) / रंग (वैकल्पिक)"></div>
                    <div class="form-group"><input type="text" id="pSize" placeholder="Sizes (ex: S, M, L) / साइज़ (वैकल्पिक)"></div>
                    <div class="form-group"><input type="file" id="pImage" multiple accept="image/*"></div>
                    <button class="add-btn" onclick="addNewProductToFirebase()" data-lang-key="btn_publish">➕ Publish Product</button>
                    <div id="adminProductList" style="margin-top: 10px; max-height: 150px; overflow-y: auto;"></div>
                </div>

                <div class="manage-section" style="border-left: 4px solid #e74c3c;"><h3 data-lang-key="add_reel">🎥 Add Reel</h3><div class="form-group"><input type="text" id="rTitle" placeholder="Title"></div><div class="form-group"><input type="text" id="rVideoUrl" placeholder="MP4 Video Link"></div><div class="form-group"><input type="text" id="rInstaUrl" placeholder="Instagram Link (Optional)"></div><button class="add-btn" onclick="addNewReelToFirebase()" data-lang-key="btn_publish_reel">🎬 Publish Reel</button><div id="adminReelList" style="margin-top: 10px;"></div></div>
            </div>
        </div>
    </div>
</body>
</html>
