<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grihani Cosmetic - Online Store</title>
    
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
        import { getDatabase, ref, set, push, onValue, get, child } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBhR9J0h01e81bSpUs2rTqV9JRndL38eUQ",
            authDomain: "grihanicosmeticapp.firebaseapp.com",
            databaseURL: "https://grihanicosmeticapp-default-rtdb.firebaseio.com",
            projectId: "grihanicosmeticapp",
            storageBucket: "grihanicosmeticapp.firebasestorage.app",
            messagingSenderId: "921623248962",
            appId: "1:921623248962:web:413b6e003eca864b7caddb"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let cart = []; let currentCategory = 'All'; let currentSlide = 0;
        let currentLang = localStorage.getItem('grihani_lang') || 'hi'; 
        
        // 🌐 भाषा बदलने का सिस्टम (Language System)
        const dict = {
            "title_reels": { hi: "🔥 ट्रेंडिंग रील्स", en: "🔥 Trending Reels" },
            "btn_all_products": { hi: "सभी प्रोडक्ट्स", en: "All Products" },
            "cart_title": { hi: "आपकी शॉपिंग कार्ट", en: "Your Shopping Cart" },
            "btn_back_store": { hi: "← वापस स्टोर पर जाएं", en: "← Back to Store" },
            "empty_cart": { hi: "आपका कार्ट खाली है।", en: "Your cart is empty." },
            "total_bill": { hi: "कुल बिल:", en: "Total Bill:" },
            "btn_checkout": { hi: "ऑर्डर करें (Checkout)", en: "Checkout Now" },
            "order_history_title": { hi: "📦 मेरे ऑर्डर्स (Order History)", en: "📦 My Order History" },
            "guest_user": { hi: "👤 गेस्ट यूजर (लॉगिन करें)", en: "👤 Guest (Login)" },
            "my_orders_btn": { hi: "📦 मेरे ऑर्डर", en: "📦 My Orders" },
            "logout_btn": { hi: "लॉग आउट", en: "Logout" },
            "login_title": { hi: "✨ Grihani Cosmetic में स्वागत है", en: "✨ Welcome to Grihani Cosmetic" },
            "login_new": { hi: "🚀 नया रजिस्ट्रेशन करें", en: "🚀 Register New Account" },
            "login_exist": { hi: "🔑 पहले से रजिस्टर्ड हैं? लॉगिन करें", en: "🔑 Already Registered? Login" },
            "close_btn": { hi: "❌ बंद करें", en: "❌ Close" },
            "confirm_title": { hi: "ऑर्डर की पुष्टि करें", en: "Confirm Your Order" },
            "pay_mode_title": { hi: "पेमेंट का तरीका चुनें:", en: "Select Payment Mode:" },
            "cod_opt": { hi: "कैश ऑन डिलीवरी (COD)", en: "Cash on Delivery (COD)" },
            "online_opt": { hi: "ऑनलाइन पेमेंट", en: "Pay Online (UPI/Card)" },
            "confirm_order_btn": { hi: "✅ पेमेंट और ऑर्डर पक्का करें", en: "✅ Confirm Order & Pay" }
        };

        window.toggleLanguage = function() {
            currentLang = currentLang === 'hi' ? 'en' : 'hi';
            localStorage.setItem('grihani_lang', currentLang);
            document.getElementById('langToggleBtn').innerText = currentLang === 'hi' ? '🌐 English' : '🌐 हिंदी';
            applyLanguage();
            loadProducts(); 
            fetchMyOrders(); 
            renderCartItems(); 
        }

        function applyLanguage() {
            document.querySelectorAll('[data-lang-key]').forEach(el => {
                let key = el.getAttribute('data-lang-key');
                if(dict[key]) el.innerText = dict[key][currentLang];
            });
            if(!localStorage.getItem('grihani_user_phone')) {
                document.getElementById('userDisplay').innerText = dict["guest_user"][currentLang];
            }
        }

        window.startBannerSlider = function() {
            const slides = document.querySelectorAll('.banner-slide');
            if(slides.length === 0) return;
            setInterval(() => { slides[currentSlide].style.display = 'none'; currentSlide = (currentSlide + 1) % slides.length; slides[currentSlide].style.display = 'block'; }, 3000);
        }

        window.loadCategories = function() {
            onValue(ref(db, 'categories'), (snapshot) => {
                const data = snapshot.val(); let filterDiv = document.getElementById('categoryFilters');
                filterDiv.innerHTML = `<button class="cat-filter-btn active" onclick="filterCategory('All', this)">${currentLang === 'hi' ? 'सभी प्रोडक्ट्स' : 'All Products'}</button>`;
                let categories = data ? data : { "Bridal": "ब्राइडल", "Gifts": "गिफ्ट्स", "Daily": "डेली वियर" };
                Object.keys(categories).forEach((catKey) => { filterDiv.innerHTML += `<button class="cat-filter-btn" onclick="filterCategory('${catKey}', this)">${categories[catKey]}</button>`; });
            });
        }

        window.loadProducts = function() {
            onValue(ref(db, 'products'), (snapshot) => {
                const data = snapshot.val(); let appDiv = document.getElementById('appProducts'); appDiv.innerHTML = '';
                if (!data) return appDiv.innerHTML = `<p style="grid-column: span 4; text-align:center; color:#777; margin-top:30px;">${currentLang === 'hi' ? 'कोई प्रोडक्ट नहीं है।' : 'No products available.'}</p>`;
                Object.keys(data).forEach((key) => {
                    let item = data[key];
                    if (currentCategory === 'All' || item.category === currentCategory) {
                        let btnText = currentLang === 'hi' ? 'कार्ट में डालें' : 'Add to Cart';
                        appDiv.innerHTML += `<div class="product-card"><span class="cat-tag">${item.category}</span><img src="${item.image}" class="product-img"><div class="product-title">${item.name}</div><div class="product-price">₹${item.price}</div><button class="cart-btn" onclick='addToCart(${JSON.stringify(item)})'>${btnText}</button></div>`;
                    }
                });
            });
        }

        window.loadReels = function() {
            onValue(ref(db, 'reels'), (snapshot) => {
                const data = snapshot.val(); let reelFeed = document.getElementById('appReelsFeed'); reelFeed.innerHTML = '';
                if(!data) return reelFeed.innerHTML = '<p style="font-size:12px; color:#777; padding:10px;">No reels available.</p>';
                Object.keys(data).forEach(key => {
                    let r = data[key]; let instaButton = (r.instaUrl && r.instaUrl !== '#') ? `<a href="${r.instaUrl}" target="_blank" class="insta-link-btn">📷 Instagram</a>` : '';
                    reelFeed.innerHTML += `<div class="reel-card"><video class="reel-video" autoplay muted loop playsinline><source src="${r.url}" type="video/mp4"></video><div class="reel-title">${r.title}</div>${instaButton}</div>`;
                });
            });
        }

        window.onload = function() {
            document.getElementById('langToggleBtn').innerText = currentLang === 'hi' ? '🌐 English' : '🌐 हिंदी';
            applyLanguage(); loadCategories(); loadProducts(); loadReels(); startBannerSlider();
            let savedPhone = localStorage.getItem('grihani_user_phone');
            if(savedPhone) { updateUserUI(localStorage.getItem('grihani_user_name')); }
        }

        window.openLoginModal = function() { document.getElementById('loginModal').style.display = 'flex'; }
        window.closeLoginModal = function() { document.getElementById('loginModal').style.display = 'none'; }

        window.saveCustomerLogin = function() {
            let name = document.getElementById('regName').value, phone = document.getElementById('regPhone').value, address = document.getElementById('regAddress').value;
            if(!name || phone.length < 10 || !address) return alert(currentLang === 'hi' ? "कृपया सही जानकारी दर्ज करें!" : "Please enter valid details!");
            let cleanPhone = phone.replace(/[^0-9]/g, '');
            set(ref(db, 'customers/' + cleanPhone), { name, phone, address, date: new Date().toLocaleString() }).then(() => {
                localStorage.setItem('grihani_user_name', name); localStorage.setItem('grihani_user_phone', phone); localStorage.setItem('grihani_user_address', address);
                document.getElementById('loginModal').style.display = 'none'; updateUserUI(name); alert(currentLang === 'hi' ? "✨ रजिस्ट्रेशन सफल रहा!" : "✨ Registration Successful!");
            });
        }

        window.existingCustomerLogin = function() {
            let phone = document.getElementById('regPhone').value.trim();
            if(phone.length < 10) return alert(currentLang === 'hi' ? "सही मोबाइल नंबर दर्ज करें!" : "Enter valid mobile number!");
            get(child(ref(db), `customers/${phone.replace(/[^0-9]/g, '')}`)).then((snapshot) => {
                if (snapshot.exists()) {
                    let cData = snapshot.val();
                    localStorage.setItem('grihani_user_name', cData.name); localStorage.setItem('grihani_user_phone', cData.phone); localStorage.setItem('grihani_user_address', cData.address);
                    document.getElementById('loginModal').style.display = 'none'; updateUserUI(cData.name); alert((currentLang === 'hi' ? "🎉 स्वागत है " : "🎉 Welcome ") + cData.name + "!");
                } else alert(currentLang === 'hi' ? "यह नंबर रजिस्टर्ड नहीं है। कृपया नया रजिस्ट्रेशन करें!" : "Number not registered. Please register!");
            });
        }

        function updateUserUI(name) { document.getElementById('userDisplay').innerText = "👤 " + name; document.getElementById('userDisplay').onclick = null; document.getElementById('myOrdersBtn').style.display = 'inline-block'; document.getElementById('logoutBtn').style.display = 'inline-block'; fetchMyOrders(); }
        window.logoutUser = function() { if(confirm(currentLang === 'hi' ? "क्या आप लॉग आउट करना चाहते हैं?" : "Do you want to logout?")) { localStorage.clear(); location.reload(); } }
        window.filterCategory = function(cat, btnElement) { currentCategory = cat; document.querySelectorAll('.cat-filter-btn').forEach(btn => btn.classList.remove('active')); btnElement.classList.add('active'); loadProducts(); }
        window.addToCart = function(product) { let existingItem = cart.find(item => item.name === product.name); if(existingItem) existingItem.qty += 1; else cart.push({ ...product, qty: 1 }); alert(product.name + (currentLang === 'hi' ? " कार्ट में जुड़ गया!" : " added to cart!")); updateCartCount(); }
        window.updateCartCount = function() { let total = 0; cart.forEach(item => total += item.qty); document.getElementById('cartCount').innerText = total; }
        window.increaseQty = function(index) { cart[index].qty += 1; updateCartCount(); renderCartItems(); }
        window.decreaseQty = function(index) { cart[index].qty -= 1; if(cart[index].qty === 0) cart.splice(index, 1); updateCartCount(); renderCartItems(); }
        
        window.openCart = function() { document.getElementById('homePage').style.display = 'none'; document.getElementById('ordersPage').style.display = 'none'; document.getElementById('cartPage').style.display = 'block'; renderCartItems(); }
        window.closeCart = function() { document.getElementById('cartPage').style.display = 'none'; document.getElementById('homePage').style.display = 'block'; }
        window.openOrdersPage = function() { document.getElementById('homePage').style.display = 'none'; document.getElementById('cartPage').style.display = 'none'; document.getElementById('ordersPage').style.display = 'block'; }
        window.closeOrdersPage = function() { document.getElementById('ordersPage').style.display = 'none'; document.getElementById('homePage').style.display = 'block'; }

        // Live Real-Time Variables
        let liveActiveOrders = {};
        let liveHistoryOrders = {};

        window.fetchMyOrders = function() {
            let phone = localStorage.getItem('grihani_user_phone');
            if(!phone) return;
            onValue(ref(db, 'orders'), (snapshot) => { liveActiveOrders = snapshot.val() || {}; window.renderLiveOrders(phone); });
            onValue(ref(db, 'order_history'), (snapshot) => { liveHistoryOrders = snapshot.val() || {}; window.renderLiveOrders(phone); });
        }

        window.renderLiveOrders = function(phone) {
            let ordersDiv = document.getElementById('myOrdersList');
            if(!ordersDiv) return;
            let myOrders = [];
            Object.keys(liveActiveOrders).forEach(key => { if(liveActiveOrders[key].customerPhone === phone) myOrders.push({...liveActiveOrders[key], id: key}); });
            Object.keys(liveHistoryOrders).forEach(key => { if(liveHistoryOrders[key].customerPhone === phone) myOrders.push({...liveHistoryOrders[key], id: key}); });
            
            if(myOrders.length === 0) { 
                ordersDiv.innerHTML = `<div style="text-align:center; padding:30px;"><h3 style="color:#777; margin-bottom:10px;">📦 ${currentLang === 'hi' ? 'कोई ऑर्डर नहीं मिला' : 'No Orders Found'}</h3></div>`; 
                return; 
            }
            
            myOrders.sort((a, b) => new Date(b.date) - new Date(a.date));

            let htmlString = '';
            myOrders.forEach(order => {
                let statusColor = 'status-new'; let statusText = (order.status || 'New').toLowerCase(); 
                let displayStatus = currentLang === 'hi' ? "नया ऑर्डर 🕒" : "New Order 🕒";
                let isShip = statusText.includes('ship'), isDel = statusText.includes('deliver'), isCan = statusText.includes('cancel');
                
                if(isShip) { statusColor = 'status-shipping'; displayStatus = currentLang === 'hi' ? "रास्ते में है 🚚" : "Shipped 🚚"; }
                else if(isDel) { statusColor = 'status-delivered'; displayStatus = currentLang === 'hi' ? "डिलीवर हो गया ✅" : "Delivered ✅"; }
                else if(isCan) { statusColor = 'status-cancelled'; displayStatus = currentLang === 'hi' ? "रद्द ❌" : "Cancelled ❌"; }

                let progressHtml = '';
                if(!isCan) {
                    progressHtml = `
                        <div style="display:flex; justify-content:space-between; font-size:10px; margin: 15px 0 5px 0; color:#888; text-align:center; font-weight:bold;">
                            <div style="color: ${statusText === 'new' || isShip || isDel ? '#f39c12' : '#ccc'};">📝<br>${currentLang === 'hi' ? 'ऑर्डर बुक' : 'Booked'}</div>
                            <div style="color: ${isShip || isDel ? '#3498db' : '#ccc'};">🚚<br>${currentLang === 'hi' ? 'डिस्पैच' : 'Dispatched'}</div>
                            <div style="color: ${isDel ? '#27ae60' : '#ccc'};">✅<br>${currentLang === 'hi' ? 'डिलीवर' : 'Delivered'}</div>
                        </div>
                        <div style="height:4px; background:#eee; margin-bottom:15px; border-radius:2px; position:relative; overflow:hidden;">
                            <div style="height:4px; background:${isDel ? '#27ae60' : (isShip ? '#3498db' : '#f39c12')}; width: ${isDel ? '100%' : (isShip ? '50%' : '15%')}; transition: width 0.5s; border-radius:2px;"></div>
                        </div>
                    `;
                }

                let trackingHtml = '';
                if(order.tracking) {
                    trackingHtml = '<div style="margin-top:12px; padding:10px; background:#f4f9fc; border-radius:6px; border-left:4px solid #3498db; transition: all 0.3s ease;">';
                    trackingHtml += `<strong style="font-size:12px; color:#2980b9; margin-bottom:8px; display:block;">📍 ${currentLang === 'hi' ? 'लाइव ट्रैकिंग अपडेट्स:' : 'Live Tracking:'}</strong>`;
                    let steps = Object.keys(order.tracking).map(k => order.tracking[k]);
                    steps.forEach(t => {
                        trackingHtml += `<div style="margin-bottom:8px; font-size:12px; display:flex; gap:8px;"><span style="color:#3498db;">🔹</span><div><b style="color:#333;">${t.msg}</b> <div style="font-size:10px; color:#7f8c8d; margin-top:2px;">🕒 ${t.time}</div></div></div>`;
                    });
                    if(order.courierLink) {
                        trackingHtml += `<a href="${order.courierLink}" target="_blank" style="display:block; text-align:center; background:#2980b9; color:white; text-decoration:none; font-size:13px; font-weight:bold; padding:8px; border-radius:4px; margin-top:10px;">📍 ${currentLang === 'hi' ? 'अपना कूरियर यहाँ ट्रैक करें' : 'Track Courier Here'}</a>`;
                    }
                    trackingHtml += '</div>';
                }

                let itemsHtml = order.items.map(i => `<div style="display:flex; justify-content:space-between; font-size:12px; margin-bottom:6px; padding-bottom:6px; border-bottom:1px dashed #ddd;"><span>🛍️ ${i.name} <b>(x${i.qty})</b></span> <span style="font-weight:bold; color:#333;">₹${i.price * i.qty}</span></div>`).join('');
                
                let safeOrderData = encodeURIComponent(JSON.stringify({...order, id: order.id}));
                let invoiceBtnHtml = `<button onclick="downloadInvoice('${safeOrderData}')" style="background:#800020; color:white; border:none; padding:8px 12px; border-radius:4px; font-size:12px; font-weight:bold; cursor:pointer; width:100%; margin-top:10px;">🧾 ${currentLang === 'hi' ? 'इनवॉइस / बिल डाउनलोड करें' : 'Download Invoice / Bill'}</button>`;

                htmlString += `
                    <div class="order-history-card">
                        <div class="order-history-header">
                            <span>📅 ${currentLang === 'hi' ? 'ऑर्डर:' : 'Order:'} ${order.date.split(',')[0]} <span style="font-size:10px; color:#888;">${order.date.split(',')[1]}</span></span>
                            <span class="order-status ${statusColor}">${displayStatus}</span>
                        </div>
                        ${progressHtml}
                        <div class="order-history-items" style="background:#f9f9f9; padding:10px; border-radius:6px; margin-bottom:12px; border:1px solid #eee;">
                            <strong style="font-size:11px; color:#800020; display:block; margin-bottom:8px; text-transform:uppercase;">${currentLang === 'hi' ? 'खरीदे गए आइटम:' : 'Purchased Items:'}</strong>
                            ${itemsHtml}
                        </div>
                        ${trackingHtml}
                        <div class="order-history-total" style="display:flex; justify-content:space-between; align-items:center; margin-top:10px;">
                            <span style="font-size:11px; color:#555;">${currentLang === 'hi' ? 'पेमेंट:' : 'Payment:'} <b>${order.paymentMode}</b></span>
                            <span>${currentLang === 'hi' ? 'कुल बिल:' : 'Total:'} <b>${order.total}</b></span>
                        </div>
                        ${invoiceBtnHtml}
                    </div>
                `;
            });
            ordersDiv.innerHTML = htmlString;
        }

        // 🧾 INVOICE GENERATOR FUNCTION (FIXED BROWSER BUG 100%)
        window.downloadInvoice = function(orderStr) {
            let order = JSON.parse(decodeURIComponent(orderStr));
            let invoiceWindow = window.open('', '_blank');
            let itemsHtml = order.items.map(i => `<tr><td style="padding:10px; border:1px solid #ddd;">${i.name}</td><td style="padding:10px; border:1px solid #ddd; text-align:center;">${i.qty}</td><td style="padding:10px; border:1px solid #ddd; text-align:right;">₹${i.price}</td><td style="padding:10px; border:1px solid #ddd; text-align:right;">₹${i.price * i.qty}</td></tr>`).join('');
            
            // यह नया तरीका ब्राउज़र को कंफ्यूज नहीं होने देगा
            let scrOpen = "<scr" + "ipt>";
            let scrClose = "</scr" + "ipt>";

            let html = `
            <html><head><title>Invoice - ${order.id || 'Order'}</title></head>
            <body style="font-family:'Segoe UI', sans-serif; padding:40px; color:#333; max-width:800px; margin:auto;">
                <h1 style="color:#800020; text-align:center; margin-bottom:5px;">GRIHANI COSMETIC</h1>
                <p style="text-align:center; font-size:14px; color:#555; margin-top:0;">Ramkrishna Nagar, Patna, Bihar, India</p>
                <hr style="border:1px solid #eee; margin:20px 0;">
                <h2 style="text-align:center; background:#f4f4f4; padding:10px;">TAX INVOICE / BILL</h2>
                <div style="display:flex; justify-content:space-between; margin-bottom:30px; font-size:14px; line-height:1.6;">
                    <div><b style="color:#800020;">Billed To:</b><br>${order.customerName}<br>Phone: ${order.customerPhone}<br>Address: ${order.customerAddress}</div>
                    <div style="text-align:right;"><b style="color:#800020;">Order Details:</b><br>Date: ${order.date}<br>Payment Mode: ${order.paymentMode}<br>Status: ${order.status}</div>
                </div>
                <table style="width:100%; border-collapse: collapse; margin-bottom:20px; font-size:14px;">
                    <tr style="background:#800020; color:white;"><th style="padding:10px; border:1px solid #800020; text-align:left;">Item Name</th><th style="padding:10px; border:1px solid #800020;">Qty</th><th style="padding:10px; border:1px solid #800020; text-align:right;">Price</th><th style="padding:10px; border:1px solid #800020; text-align:right;">Total</th></tr>
                    ${itemsHtml}
                </table>
                <h3 style="text-align:right; color:#800020; padding-top:10px; border-top:2px solid #eee;">Grand Total: ${order.total}</h3>
                <p style="text-align:center; margin-top:40px; font-size:13px; color:#777;">Thank you for shopping with Grihani Cosmetic!<br>If you have any questions concerning this invoice, contact us.</p>
                ${scrOpen}window.onload = function() { window.print(); }${scrClose}
            </body></html>`;
            invoiceWindow.document.write(html);
            invoiceWindow.document.close();
        }

        window.renderCartItems = function() {
            let cartDiv = document.getElementById('cartItemsList'); cartDiv.innerHTML = ''; let total = 0;
            if(cart.length === 0) cartDiv.innerHTML = `<p style="text-align:center; color:#777; padding:20px;" data-lang-key="empty_cart">${dict["empty_cart"][currentLang]}</p>`;
            else cart.forEach((item, index) => {
                let itemTotal = parseInt(item.price) * item.qty; total += itemTotal;
                cartDiv.innerHTML += `<div class="cart-item"><img src="${item.image}"><div class="cart-item-info"><div class="cart-item-title">${item.name}</div><div class="cart-item-price">₹${item.price}</div><div class="qty-controls"><button class="qty-btn" onclick="decreaseQty(${index})">-</button><span class="qty-display">${item.qty}</span><button class="qty-btn" onclick="increaseQty(${index})">+</button></div></div><div class="item-total">₹${itemTotal}</div></div>`;
            }); document.getElementById('totalAmount').innerText = "₹" + total;
        }

        window.openCheckoutForm = function() {
            if(cart.length === 0) return alert(currentLang === 'hi' ? "कार्ट खाली है!" : "Cart is empty!");
            if(!localStorage.getItem('grihani_user_phone')) return document.getElementById('loginModal').style.display = 'flex';
            document.getElementById('confirmName').innerText = localStorage.getItem('grihani_user_name'); document.getElementById('confirmPhone').innerText = localStorage.getItem('grihani_user_phone'); document.getElementById('confirmAddress').innerText = localStorage.getItem('grihani_user_address'); document.getElementById('checkoutModal').style.display = 'flex';
        }
        window.closeCheckoutForm = function() { document.getElementById('checkoutModal').style.display = 'none'; }

        window.confirmOrder = function() {
            let name = localStorage.getItem('grihani_user_name'), phone = localStorage.getItem('grihani_user_phone'), address = localStorage.getItem('grihani_user_address');
            let payMode = document.getElementById('payMode').value, totalAmountNum = parseInt(document.getElementById('totalAmount').innerText.replace('₹', '')) * 100; 
            closeCheckoutForm();
            if(payMode === 'Online UPI') {
