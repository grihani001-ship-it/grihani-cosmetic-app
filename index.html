<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grihani Cosmetic - Online Store</title>
    
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
        import { getDatabase, ref, set, push, onValue, get, child } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBhR9J0h01e81bSpUs2rTqV9JRndL38eUQ",
            authDomain: "grihanicosmeticapp.firebaseapp.com",
            databaseURL: "https://grihanicosmeticapp-default-rtdb.firebaseio.com",
            projectId: "grihanicosmeticapp",
            storageBucket: "grihanicosmeticapp.firebasestorage.app",
            messagingSenderId: "921623248962",
            appId: "1:921623248962:web:413b6e003eca864b7caddb"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let cart = [];
        let currentCategory = 'All';

        let currentSlide = 0;
        window.startBannerSlider = function() {
            const slides = document.querySelectorAll('.banner-slide');
            if(slides.length === 0) return;
            setInterval(() => {
                slides[currentSlide].style.display = 'none';
                currentSlide = (currentSlide + 1) % slides.length;
                slides[currentSlide].style.display = 'block';
            }, 3000);
        }

        window.loadCategories = function() {
            onValue(ref(db, 'categories'), (snapshot) => {
                const data = snapshot.val();
                let filterDiv = document.getElementById('categoryFilters');
                filterDiv.innerHTML = `<button class="cat-filter-btn active" onclick="filterCategory('All', this)">सभी प्रोडक्ट्स</button>`;
                let categories = data ? data : { "Bridal": "ब्राइडल", "Gifts": "गिफ्ट्स", "Daily": "डेली वियर" };
                Object.keys(categories).forEach((catKey) => {
                    filterDiv.innerHTML += `<button class="cat-filter-btn" onclick="filterCategory('${catKey}', this)">${categories[catKey]}</button>`;
                });
            });
        }

        window.loadProducts = function() {
            onValue(ref(db, 'products'), (snapshot) => {
                const data = snapshot.val();
                let appDiv = document.getElementById('appProducts');
                appDiv.innerHTML = '';
                if (!data) {
                    appDiv.innerHTML = '<p style="grid-column: span 4; text-align:center; color:#777; margin-top:30px;">कोई प्रोडक्ट उपलब्ध नहीं है।</p>';
                    return;
                }
                Object.keys(data).forEach((key) => {
                    let item = data[key];
                    if (currentCategory === 'All' || item.category === currentCategory) {
                        appDiv.innerHTML += `
                            <div class="product-card">
                                <span class="cat-tag">${item.category}</span>
                                <img src="${item.image}" class="product-img">
                                <div class="product-title">${item.name}</div>
                                <div class="product-price">₹${item.price}</div>
                                <button class="cart-btn" onclick='addToCart(${JSON.stringify(item)})'>Add to Cart</button>
                            </div>
                        `;
                    }
                });
            });
        }

        window.loadReels = function() {
            onValue(ref(db, 'reels'), (snapshot) => {
                const data = snapshot.val();
                let reelFeed = document.getElementById('appReelsFeed');
                reelFeed.innerHTML = '';
                if(!data) {
                    reelFeed.innerHTML = '<p style="font-size:12px; color:#777; padding:10px;">कोई रील उपलब्ध नहीं है।</p>';
                    return;
                }
                Object.keys(data).forEach(key => {
                    let r = data[key];
                    let instaButton = (r.instaUrl && r.instaUrl !== '#') ? `<a href="${r.instaUrl}" target="_blank" class="insta-link-btn">📷 Instagram</a>` : '';
                    reelFeed.innerHTML += `
                        <div class="reel-card">
                            <video class="reel-video" autoplay muted loop playsinline><source src="${r.url}" type="video/mp4"></video>
                            <div class="reel-title">${r.title}</div>
                            ${instaButton}
                        </div>
                    `;
                });
            });
        }

        window.onload = function() {
            loadCategories();
            loadProducts();
            loadReels();
            startBannerSlider();
            let savedPhone = localStorage.getItem('grihani_user_phone');
            if(savedPhone) {
                document.getElementById('userDisplay').innerText = "👤 " + localStorage.getItem('grihani_user_name') + " (" + savedPhone + ")";
            }
        }

        window.openLoginModal = function() { document.getElementById('loginModal').style.display = 'flex'; }
        window.closeLoginModal = function() { document.getElementById('loginModal').style.display = 'none'; }

        window.saveCustomerLogin = function() {
            let name = document.getElementById('regName').value, phone = document.getElementById('regPhone').value, address = document.getElementById('regAddress').value;
            if(!name || phone.length < 10 || !address) return alert("कृपया सही जानकारी दर्ज करें!");
            let cleanPhone = phone.replace(/[^0-9]/g, '');
            set(ref(db, 'customers/' + cleanPhone), { name, phone, address, date: new Date().toLocaleString() }).then(() => {
                localStorage.setItem('grihani_user_name', name); localStorage.setItem('grihani_user_phone', phone); localStorage.setItem('grihani_user_address', address);
                document.getElementById('loginModal').style.display = 'none';
                document.getElementById('userDisplay').innerText = "👤 " + name + " (" + phone + ")";
                alert("✨ रजिस्ट्रेशन सफल रहा!");
            });
        }

        window.existingCustomerLogin = function() {
            let phone = document.getElementById('regPhone').value.trim();
            if(phone.length < 10) return alert("सही मोबाइल नंबर दर्ज करें!");
            get(child(ref(db), `customers/${phone.replace(/[^0-9]/g, '')}`)).then((snapshot) => {
                if (snapshot.exists()) {
                    let cData = snapshot.val();
                    localStorage.setItem('grihani_user_name', cData.name); localStorage.setItem('grihani_user_phone', cData.phone); localStorage.setItem('grihani_user_address', cData.address);
                    document.getElementById('loginModal').style.display = 'none';
                    document.getElementById('userDisplay').innerText = "👤 " + cData.name + " (" + cData.phone + ")";
                    alert("🎉 स्वागत है " + cData.name + "!");
                } else alert("यह नंबर रजिस्टर्ड नहीं है। कृपया नया रजिस्ट्रेशन करें!");
            });
        }

        window.logoutUser = function() { if(confirm("क्या आप लॉग आउट करना चाहते हैं?")) { localStorage.clear(); location.reload(); } }
        window.filterCategory = function(cat, btnElement) { currentCategory = cat; document.querySelectorAll('.cat-filter-btn').forEach(btn => btn.classList.remove('active')); btnElement.classList.add('active'); loadProducts(); }
        window.addToCart = function(product) { let existingItem = cart.find(item => item.name === product.name); if(existingItem) existingItem.qty += 1; else cart.push({ ...product, qty: 1 }); alert(product.name + " कार्ट में जुड़ गया!"); updateCartCount(); }
        window.updateCartCount = function() { let total = 0; cart.forEach(item => total += item.qty); document.getElementById('cartCount').innerText = total; }
        window.increaseQty = function(index) { cart[index].qty += 1; updateCartCount(); renderCartItems(); }
        window.decreaseQty = function(index) { cart[index].qty -= 1; if(cart[index].qty === 0) cart.splice(index, 1); updateCartCount(); renderCartItems(); }
        window.openCart = function() { document.getElementById('homePage').style.display = 'none'; document.getElementById('cartPage').style.display = 'block'; renderCartItems(); }
        window.closeCart = function() { document.getElementById('cartPage').style.display = 'none'; document.getElementById('homePage').style.display = 'block'; }

        window.renderCartItems = function() {
            let cartDiv = document.getElementById('cartItemsList'); cartDiv.innerHTML = ''; let total = 0;
            if(cart.length === 0) cartDiv.innerHTML = '<p style="text-align:center; color:#777; padding:20px;">आपका कार्ट खाली है।</p>';
            else cart.forEach((item, index) => {
                let itemTotal = parseInt(item.price) * item.qty; total += itemTotal;
                cartDiv.innerHTML += `
                    <div class="cart-item"><img src="${item.image}"><div class="cart-item-info"><div class="cart-item-title">${item.name}</div><div class="cart-item-price">₹${item.price}</div>
                    <div class="qty-controls"><button class="qty-btn" onclick="decreaseQty(${index})">-</button><span class="qty-display">${item.qty}</span><button class="qty-btn" onclick="increaseQty(${index})">+</button></div></div>
                    <div class="item-total">₹${itemTotal}</div></div>`;
            });
            document.getElementById('totalAmount').innerText = "₹" + total;
        }

        window.openCheckoutForm = function() {
            if(cart.length === 0) return alert("कार्ट खाली है!");
            if(!localStorage.getItem('grihani_user_phone')) return document.getElementById('loginModal').style.display = 'flex';
            document.getElementById('confirmName').innerText = localStorage.getItem('grihani_user_name');
            document.getElementById('confirmPhone').innerText = localStorage.getItem('grihani_user_phone');
            document.getElementById('confirmAddress').innerText = localStorage.getItem('grihani_user_address');
            document.getElementById('checkoutModal').style.display = 'flex';
        }
        window.closeCheckoutForm = function() { document.getElementById('checkoutModal').style.display = 'none'; }

        window.confirmOrder = function() {
            let name = localStorage.getItem('grihani_user_name'), phone = localStorage.getItem('grihani_user_phone'), address = localStorage.getItem('grihani_user_address');
            let payMode = document.getElementById('payMode').value, totalAmountNum = parseInt(document.getElementById('totalAmount').innerText.replace('₹', '')) * 100; 
            closeCheckoutForm();
            if(payMode === 'Online UPI') {
                var rzp1 = new Razorpay({ "key": "rzp_test_123456789abcdef", "amount": totalAmountNum, "currency": "INR", "name": "Grihani Cosmetic",
                    "handler": function (response){ saveOrderData("Online Paid", response.razorpay_payment_id, totalAmountNum); },
                    "prefill": { "name": name, "contact": phone }, "theme": { "color": "#800020" }
                }); rzp1.open();
            } else { saveOrderData("Cash on Delivery (COD)", "N/A", totalAmountNum); }
        }

        function saveOrderData(paymentMode, paymentId, totalAmountNum) {
            set(push(ref(db, 'orders')), {
                customerName: localStorage.getItem('grihani_user_name'), customerPhone: localStorage.getItem('grihani_user_phone'),
                customerAddress: localStorage.getItem('grihani_user_address'), paymentMode, paymentId, items: cart, 
                total: "₹" + (totalAmountNum / 100), date: new Date().toLocaleString(), status: 'New'
            }).then(() => { alert("🎉 आपका ऑर्डर सफलतापूलवक दर्ज हो गया है!"); cart = []; updateCartCount(); closeCart(); });
        }
    </script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #f4f6f7; color: #333; display: flex; flex-direction: column; min-height: 100vh; }
        
        /* फुल-स्क्रीन वेबसाइट कंटेनर और हेडर */
        .website-container { width: 100%; max-width: 1200px; margin: 0 auto; background-color: #fff; box-shadow: 0 0 20px rgba(0,0,0,0.1); min-height: 100vh; display: flex; flex-direction: column; }
        .app-header { background-color: #800020; color: white; padding: 12px 25px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .logo-title-container { display: flex; align-items: center; gap: 12px; }
        .app-logo { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; border: 2px solid #fff; background: #fff; }
        .app-header span:nth-child(2) { font-size: 20px; font-weight: bold; }
        
        .cart-icon { font-size: 18px; position: relative; cursor: pointer; background: rgba(255,255,255,0.2); padding: 8px 15px; border-radius: 20px; }
        #cartCount { background-color: #f1c40f; color: #800020; font-size: 11px; font-weight: bold; padding: 2px 6px; border-radius: 50%; position: absolute; top: -5px; right: -5px; }
        
        .user-profile-bar { background: #fdf2f2; padding: 8px 25px; display: flex; justify-content: space-between; font-size: 13px; border-bottom: 1px solid #ddd; color: #800020; font-weight: bold; cursor: pointer; }
        
        #homePage { flex-grow: 1; padding-bottom: 30px; }
        
        /* ऑटो-स्लाइडिंग मास्टर बैनर (फुल स्क्रीन) */
        .banner-container { width: 100%; height: 320px; position: relative; overflow: hidden; background: #000; }
        .banner-slide { width: 100%; height: 100%; display: none; position: absolute; top: 0; left: 0; }
        .banner-slide img { width: 100%; height: 100%; object-fit: cover; }
        .banner-slide:first-child { display: block; }

        .reels-section { padding: 15px 25px; background: #fff5f5; border-bottom: 1px solid #ddd; }
        .reels-section h4 { font-size: 15px; color: #800020; margin-bottom: 10px; }
        .reels-container { display: flex; gap: 15px; overflow-x: auto; scrollbar-width: thin; padding-bottom: 5px; }
        .reel-card { min-width: 130px; height: 200px; background: #000; border-radius: 8px; overflow: hidden; position: relative; flex-shrink: 0; display: flex; flex-direction: column; justify-content: flex-end; }
        .reel-video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
        .reel-title { position: relative; z-index: 2; background: rgba(0,0,0,0.6); color: white; font-size: 10px; padding: 4px; text-align: center; }
        .insta-link-btn { position: relative; z-index: 2; background: #E1306C; color: white; font-size: 9px; padding: 4px; text-align: center; text-decoration: none; font-weight: bold; display: block; }
        
        .category-filters { display: flex; gap: 10px; padding: 15px 25px; overflow-x: auto; background: #fff; }
        .cat-filter-btn { padding: 8px 18px; border: 1px solid #800020; background: white; color: #800020; border-radius: 20px; font-size: 13px; font-weight: bold; cursor: pointer; white-space: nowrap; transition: 0.2s; }
        .cat-filter-btn.active, .cat-filter-btn:hover { background: #800020; color: white; }
        
        /* प्रोडक्ट्स ग्रिड (लैपटॉप पर 4 कॉलम, मोबाइल पर 2 कॉलम) */
        .products-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; padding: 20px 25px; }
        .product-card { border: 1px solid #eee; border-radius: 10px; padding: 10px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.05); position: relative; background: #fff; transition: 0.3s; }
        .product-card:hover { transform: translateY(-3px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .cat-tag { position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,0.6); color: white; font-size: 9px; padding: 3px 6px; border-radius: 4px; }
        .product-img { width: 100%; height: 180px; object-fit: cover; border-radius: 8px; margin-bottom: 10px; }
        .product-title { font-size: 14px; font-weight: bold; color: #333; margin-bottom: 5px; }
        .product-price { font-size: 15px; color: #800020; font-weight: bold; margin-bottom: 10px; }
        .cart-btn { background-color: #fff; color: #800020; border: 1px solid #800020; padding: 8px 0; width: 100%; border-radius: 20px; cursor: pointer; font-size: 12px; font-weight: bold; transition: 0.2s; }
        .cart-btn:hover { background-color: #800020; color: #fff; }

        /* कार्ट पेज स्टाइल */
        #cartPage { display: none; padding: 25px; flex-grow: 1; }
        .back-btn { padding: 8px 15px; background: #f1f2f6; font-weight: bold; cursor: pointer; border-radius: 5px; display: inline-block; color: #800020; font-size: 13px; margin-bottom: 20px; }
        .cart-items-container { max-width: 600px; margin: 0 auto; }
        .cart-item { display: flex; align-items: center; background: white; padding: 12px; border-radius: 8px; margin-bottom: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); border: 1px solid #eee; }
        .cart-item img { width: 60px; height: 60px; border-radius: 6px; object-fit: cover; margin-right: 15px; }
        .cart-item-info { flex-grow: 1; }
        .cart-item-title { font-size: 14px; font-weight: bold; margin-bottom: 3px; }
        .cart-item-price { font-size: 12px; color: #888; margin-bottom: 6px; }
        .qty-controls { display: flex; align-items: center; background: #f1f2f6; border-radius: 15px; width: fit-content; }
        .qty-btn { background: none; border: none; padding: 4px 10px; font-size: 14px; font-weight: bold; cursor: pointer; color: #800020; }
        .qty-display { font-size: 13px; font-weight: bold; padding: 0 8px; min-width: 20px; text-align: center; }
        .item-total { font-weight: bold; color: #800020; font-size: 14px; }
        .checkout-footer { max-width: 600px; margin: 20px auto 0; background: #fdf2f2; padding: 20px; border-radius: 10px; border: 1px solid #f5c6cb; }
        .total-bill { font-size: 18px; font-weight: bold; margin-bottom: 15px; display: flex; justify-content: space-between; color: #800020; }
        .checkout-btn { background-color: #27ae60; color: white; padding: 12px; width: 100%; border: none; border-radius: 25px; font-size: 16px; font-weight: bold; cursor: pointer; }

        /* मोडल (पॉप-अप) स्टाइल */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: white; width: 100%; max-width: 400px; padding: 25px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.2); }
        .modal-content h3 { color: #800020; margin-bottom: 15px; text-align: center; font-size: 18px; }
        .modal-input { width: 100%; padding: 10px; margin-bottom: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px; }
        .confirm-order-btn, .login-existing-btn { color: white; border: none; padding: 10px; width: 100%; border-radius: 20px; font-size: 14px; font-weight: bold; cursor: pointer; margin-bottom: 8px; }
        .confirm-order-btn { background: #800020; } .login-existing-btn { background: #2980b9; }
        .cancel-order-btn { background: #ecf0f1; color: #333; border: none; padding: 10px; width: 100%; border-radius: 20px; font-size: 13px; font-weight: bold; cursor: pointer; }

        /* मोबाइल के लिए ऑटो-एडजेस्ट (Responsive Media Query) */
        @media(max-width: 768px) {
            .website-container { max-width: 100%; box-shadow: none; }
            .products-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 10px; }
            .banner-container { height: 180px; }
            .app-header { padding: 10px 15px; }
            .user-profile-bar { padding: 6px 15px; font-size: 11px; }
            .product-img { height: 120px; }
        }
    </style>
</head>
<body>
    <div class="website-container">
        <!-- हेडर -->
        <div class="app-header">
            <div class="logo-title-container">
                <img src="logo.png" alt="Logo" class="app-logo">
                <span>Grihani Cosmetic</span>
            </div>
            <span class="cart-icon" onclick="openCart()">🛒 कार्ट <span id="cartCount">0</span></span>
        </div>
        
        <div class="user-profile-bar" onclick="openLoginModal()">
            <span id="userDisplay">👤 गेस्ट यूजर (लॉगिन करें)</span>
            <span style="color:#c0392b;" onclick="event.stopPropagation(); logoutUser()">लॉग आउट</span>
        </div>
        
        <div id="homePage">
            <!-- ऑटो-स्लाइडिंग मास्टर बैनर -->
            <div class="banner-container" id="masterBannerSlider">
                <div class="banner-slide">
                    <img src="https://images.unsplash.com/photo-1522337360788-8b13dee7a37e?w=1200&auto=format&fit=crop&q=80" alt="Banner 1">
                </div>
                <div class="banner-slide">
                    <img src="https://images.unsplash.com/photo-1512496015851-a90fb38ba796?w=1200&auto=format&fit=crop&q=80" alt="Banner 2">
                </div>
                <div class="banner-slide">
                    <img src="https://images.unsplash.com/photo-1596462502278-27bfdc403348?w=1200&auto=format&fit=crop&q=80" alt="Banner 3">
                </div>
            </div>

            <div class="reels-section">
                <h4>🔥 ट्रेंडिंग रील्स</h4>
                <div class="reels-container" id="appReelsFeed"></div>
            </div>
            
            <div class="category-filters" id="categoryFilters"></div>
            <div class="products-grid" id="appProducts"></div>
        </div>

        <!-- कार्ट पेज -->
        <div id="cartPage" style="display:none;">
            <div class="back-btn" onclick="closeCart()">← वापस स्टोर पर जाएं</div>
            <h2 style="color: #800020; margin-bottom: 15px; font-size: 20px;">आपकी शॉपिंग कार्ट</h2>
            <div class="cart-items-container" id="cartItemsList"></div>
            <div class="checkout-footer">
                <div class="total-bill"><span>कुल बिल:</span><span id="totalAmount">₹0</span></div>
                <button class="checkout-btn" onclick="openCheckoutForm()">ऑर्डर करें (Checkout)</button>
            </div>
        </div>

        <!-- लॉगिन मॉडल -->
        <div id="loginModal" class="modal-overlay">
            <div class="modal-content">
                <h3>✨ Grihani Cosmetic में स्वागत है</h3>
                <input type="text" id="regName" class="modal-input" placeholder="पूरा नाम (सिर्फ नए के लिए)">
                <input type="tel" id="regPhone" class="modal-input" placeholder="मोबाइल नंबर (10 अंक)">
                <textarea id="regAddress" class="modal-input" placeholder="पूरा पता (डिलिवरी के लिए)" rows="3"></textarea>
                <button class="confirm-order-btn" onclick="saveCustomerLogin()">🚀 नया रजिस्ट्रेशन करें</button>
                <button class="login-existing-btn" onclick="existingCustomerLogin()">🔑 पहले से रजिस्टर्ड हैं? लॉगिन करें</button>
                <button class="cancel-order-btn" onclick="closeLoginModal()">❌ बंद करें</button>
            </div>
        </div>

        <!-- चेकआउट मॉडल -->
        <div id="checkoutModal" class="modal-overlay">
            <div class="modal-content">
                <h3>ऑर्डर की पुष्टि करें</h3>
                <div style="background: #f9f9f9; padding: 12px; border-radius: 6px; margin-bottom: 12px; font-size: 13px; border: 1px solid #ddd;">
                    <p><strong>नाम:</strong> <span id="confirmName" style="color: #800020;"></span></p>
                    <p><strong>मोबाइल:</strong> <span id="confirmPhone" style="color: #800020;"></span></p>
                    <p><strong>पता:</strong> <span id="confirmAddress" style="color: #800020;"></span></p>
                </div>
                <label style="font-size: 13px; font-weight: bold; margin-bottom: 5px; display:block;">पेमेंट का तरीका चुनें:</label>
                <select id="payMode" class="modal-input"><option value="Cash on Delivery (COD)">कैश ऑन डिलीवरी (COD)</option><option value="Online UPI">ऑनलाइन पेमेंट</option></select>
                <button class="confirm-order-btn" onclick="confirmOrder()">✅ पेमेंट और ऑर्डर पक्का करें</button>
                <button class="cancel-order-btn" onclick="closeCheckoutForm()">❌ रद्द करें</button>
            </div>
        </div>
    </div>
</body>
</html>
